name: Harmonizer automatic reference checks
on:
  push:
    branches: [fix/elu-auto-reference]
permissions:
  contents: read
jobs:
  spatial-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest playwright
      - run: python -m playwright install --with-deps chromium
      - name: Verify detection, exact clipping, cached generation and mobile layout
        run: python -m pytest tests/test_auto_reference.py tests/test_elu_cleanup.py tests/test_result_download.py tests/test_land_use_styles.py tests/test_runtime_limits.py -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auto-reference-screenshots
          path: test-artifacts/

