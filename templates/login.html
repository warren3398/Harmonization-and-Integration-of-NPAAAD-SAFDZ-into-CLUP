<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · NPAAAD/SAFDZ–CLUP Harmonizer</title><link rel="stylesheet" href="/static/style.css"></head><body class="login-page"><main class="login-wrap"><section class="login-card"><div class="login-logos"><img src="/static/assets/da_bswm_logo.png" alt="DA BSWM"><img src="/static/assets/almed_logo.png" alt="ALMED"></div><div class="login-agency"><strong>Department of Agriculture</strong><strong>Bureau of Soils and Water Management</strong><strong>Agricultural Land Management and Evaluation Division</strong></div><h1>NPAAAD/SAFDZ–CLUP Harmonizer</h1><p>Sign in to open the Harmonizer workspace.</p>{% if error %}<div class="login-error">{{ error }}</div>{% endif %}<form method="post" action="{{ url_for('login') }}" class="login-form"><input type="hidden" name="next" value="{{ destination }}"><label>Username<input name="username" autocomplete="username" required autofocus></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button type="submit">SIGN IN</button></form><div class="login-foot"><a href="{{ url_for('portal_home') }}">Back to GIS applications</a></div></section></main></body></html>
